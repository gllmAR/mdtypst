<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mdpdf-link — render</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <main>
    <h1>mdpdf-link — Renderer</h1>
    <div id="notice" class="notice"></div>

    <div id="controls" class="controls">
      <a id="download" class="btn" hidden>Download PDF</a>
      <a id="open" class="btn" target="_blank" hidden>Open PDF</a>
    </div>

    <section id="viewer" class="viewer">
      <p>PDF will appear below when ready.</p>
      <embed id="pdfEmbed" type="application/pdf" width="100%" height="600px" />
    </section>

    <section id="source" class="source" hidden>
      <h2>Source (Typst)</h2>
      <pre id="typstSource"></pre>
    </section>

    <footer>
      <p>Usage: <code>render.html?src=URL</code></p>
      <p>See <a href="/README.md">README</a> for more details.</p>
    </footer>
  </main>

  <!-- Mermaid (UMD build for browser) -->
  <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>
  <!-- jsPDF used as a placeholder PDF generator while Typst/WASM is not wired in -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="/assets/js/loader.js"></script>
</body>
</html>
