<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mdpdf-link v0.9 - Markdown to PDF Renderer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        #container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            background: #e3f2fd;
            color: #1976d2;
        }
        #status.error {
            background: #ffebee;
            color: #c62828;
        }
        #status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        #pdf-viewer {
            width: 100%;
            height: 800px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #1565c0;
        }
        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>mdpdf-link v0.9</h1>
        <p>Statically hosted, URL-driven Markdown→PDF renderer</p>
        <div id="status">Initializing...</div>
        <div id="pdf-container" style="display: none;">
            <iframe id="pdf-viewer"></iframe>
            <div class="button-group">
                <button id="download-btn">Download PDF</button>
            </div>
        </div>
    </div>

    <script type="module" src="./render.js"></script>
</body>
</html>
