<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mdtypst v0.9 - Markdown to PDF Renderer</title>
    <link rel="modulepreload" href="./vendor/typst/index.js">
    <link rel="modulepreload" href="./render.js">
    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111;
            color: #eee;
        }
        #container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #status {
            padding: 10px 12px;
            border-radius: 4px;
            background: #1e1e1e;
            color: #ddd;
            border-bottom: 1px solid #2a2a2a;
            border-radius: 0;
            font-size: 13px;
            overflow: hidden;
            max-height: 80px;
            opacity: 1;
            transform: translateY(0);
            transition:
                max-height 250ms ease,
                opacity 250ms ease,
                padding-top 250ms ease,
                padding-bottom 250ms ease,
                transform 250ms ease;
        }
        #status.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            transform: translateY(-6px);
        }
        #status.error {
            background: #2a1414;
            color: #ffb4b4;
        }
        #status.success {
            background: #142a1b;
            color: #b4ffd0;
        }
        #pdf-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            position: relative;
        }
        #pdf-viewer {
            width: 100%;
            height: 100%;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            background: #fff;
        }
        .button-group {
            display: flex;
            gap: 10px;
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;

            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 200ms ease, transform 200ms ease;
            pointer-events: none;
        }
        #pdf-container:hover .button-group,
        #pdf-container.show-controls .button-group {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }
        button {
            padding: 10px 20px;
            background: #2d6cdf;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #255cc2;
        }
        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status">Initializing...</div>
        <div id="pdf-container" style="display: none;">
            <iframe id="pdf-viewer"></iframe>
            <div class="button-group">
                <button id="download-btn" class="icon-btn" aria-label="Download PDF" title="Download PDF">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 11l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        (async () => {
            const localTypst = new URL('./vendor/typst/index.js', window.location.href).href;
            const cdnTypst =
                'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.7.0-rc2/dist/esm/index.js';
            const renderJs = new URL('./render.js', window.location.href).href;

            const loadModuleScript = (src) =>
                new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = src;
                    script.onload = () => resolve();
                    script.onerror = (e) => reject(e);
                    document.head.appendChild(script);
                });

            try {
                await loadModuleScript(localTypst);
            } catch (e) {
                console.warn('Local Typst bundle missing; falling back to CDN.', e);
                await loadModuleScript(cdnTypst);
            }

            await loadModuleScript(renderJs);
        })();
    </script>
</body>
</html>
