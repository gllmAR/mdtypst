    <div xmlns="http://www.w3.org/1999/xhtml" style="color:white;font:14px sans-serif;">
      foreignObject
    </div>
  </foreignObject>

  <text x="120" y="110" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12">unsupported features</text>
</svg>
