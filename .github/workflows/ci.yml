name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --omit=dev

      - name: Vendor runtime deps (offline)
        run: npm run offline:prepare

      - name: Build Pages artifact
        run: npm run build:pages
